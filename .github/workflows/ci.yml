name: ci
on:
  push:
    branches: [main]
  pull_request:
  # `gh workflow run ci.yml --ref <branch>` runs it on a branch without a PR (GitHub honours
  # workflow_dispatch only once it is in the default branch's copy of this file).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Bubblewrap, so the sandbox tests run instead of being skipped
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04+ lets only AppArmor-profiled programs create user namespaces.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-pid --unshare-net --ro-bind / / --proc /proc --dev /dev true
      - run: npm run build
      - run: npm run lint
      - run: npm test
        env:
          OA_REQUIRE_BWRAP: '1' # the bwrap tests fail instead of skipping
      - run: node packages/cli/dist/main.js validate docs/examples/*.yaml docs/examples/connectors.d/*.yaml
      - run: node scripts/check-docs.mjs
      # Built as on a host with umask 077 that also checked out and installed under it
      # (issue #211): the tarball and the .deb must still carry 755 and 644.
      - name: Release tarball builds and passes its smoke test
        run: chmod -R go-rwx . && umask 077 && scripts/build-release.sh --skip-build
      - name: Packages build
        run: umask 077 && scripts/build-package.sh
      - name: The tarball and the .deb are open to other users
        shell: bash # -eo pipefail, so a tar or dpkg-deb that fails fails the step
        run: |
          modes='^(drwxr-xr-x|-rw-r--r--|-rwxr-xr-x|l[rwx-]{9})$'
          closed=$(tar -tvzf dist-release/247-agent-*-linux-x64.tar.gz | awk -v m="$modes" '$1 !~ m')
          closed=$closed$(dpkg-deb -c dist-release/247-agent_*_amd64.deb | awk -v m="$modes" '$6 !~ /^\.\/etc\// && $1 !~ m')
          [ -z "$closed" ] || { echo "entries closed to other users:"; echo "$closed" | head -n 20; exit 1; }
      - name: The .deb installs, starts the service and runs the starter task
        run: |
          sudo apt-get install -y ./dist-release/247-agent_*_amd64.deb
          for _ in $(seq 30); do systemctl is-active --quiet 247-agent && break; sleep 1; done
          systemctl is-active 247-agent || { sudo journalctl -u 247-agent --no-pager -n 50; exit 1; }
          for _ in $(seq 30); do [ -S /run/247-agent/core.sock ] && break; sleep 1; done
          oa --version
          sudo oa run hello --wait
          open=$(sudo find /var/lib/247-agent -maxdepth 1 -perm /o=rwx)
          [ -z "$open" ] || { sudo ls -la /var/lib/247-agent; echo "readable by other users: $open"; exit 1; }
          sudo apt-get purge -y 247-agent
