# Builds the release tarballs on a tag `v<version>` (matching package.json) and attaches
# them, with their sha256 files, to the GitHub release of that tag.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version}" >&2; exit 1; }
      - run: npm run build
      - run: npm test
      - run: scripts/build-release.sh --target ${{ matrix.target }} --skip-build
      - name: Installer scripts as release assets (once)
        if: matrix.target == 'linux-x64'
        run: cp scripts/install.sh scripts/uninstall.sh dist-release/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.tar.gz
            dist-release/*.tar.gz.sha256
            dist-release/*.sh
          generate_release_notes: true
