# Dovecot as a STARTTLS front for GreenMail (compose.yaml). It stores no mail: every login
# is proxied to the GreenMail port of its protocol with the client's own credentials, which
# GreenMail checks. `ssl = required` keeps the plain-text listeners from accepting a login
# before STARTTLS (IMAP advertises LOGINDISABLED), so a session that logs in here was
# upgraded.
dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

base_dir = /run/dovecot
state_dir = /run/dovecot
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
log_path = /dev/stdout

protocols = imap pop3 submission

ssl = required
ssl_server {
  cert_file = /certs/tls.crt
  key_file = /certs/tls.key
}

# Plain-text ports with STARTTLS only; the image's implicit-TLS listeners are switched off.
service imap-login {
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 0
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 31110
  }
  inet_listener pop3s {
    port = 0
  }
}
service submission-login {
  inet_listener submission {
    port = 31587
  }
  inet_listener submissions {
    port = 0
  }
}

passdb static {
  fields {
    proxy = yes
    host = greenmail
    port = 3143
    nopassword = yes
  }
}
protocol pop3 {
  passdb static {
    fields {
      port = 3110
    }
  }
}
protocol submission {
  passdb static {
    fields {
      port = 3025
    }
  }
}
