# Global daemon config (docs/reference/agent-yaml.md). Paths are relative to this file.
# Start with: 247-agent-core --config docs/examples/agent.yaml

db: /var/lib/247-agent/state.db
socket: /run/247-agent/core.sock
tasks: website-updates.yaml     # a file, a directory (tasks.d), or a list of both
connectors: connectors.d          # manifest files, directories, or inline manifests
workers: 4
log: { level: info }
limits: { max_event_depth: 32 }
defaults:
  timeout: 15m
  sandbox: none                   # bwrap: run shell actions in bubblewrap (docs/tasks/shell.md)
  llm:   { provider: anthropic, model: claude-haiku-4-5, max_tokens: 1024 }
  decide: { provider: openrouter, model: typesafe/jev-1.13 }   # classification via the Decisions API (docs/tasks/decide.md)
  agent: { connector: claude, max_tool_calls: 30, budget: { max_usd: 1.0 } }   # `agent` actions: which ACP connector, tool-call cap, budget; work_dir defaults to work/ next to the db (docs/tasks/agent.md)
  retry: { attempts: 3, backoff: exponential, base: 30s }
secrets: { backend: systemd-credentials }   # or { backend: env, prefix: OA_SECRET_ } or { backend: file, path: secrets.yaml }
# Model providers (docs/tasks/llm.md). Keys are secret references, resolved per call.
providers:
  anthropic: { type: anthropic, api_key: "${secrets.anthropic_api_key}" }
  openai: { type: openai, api_key: "${secrets.openai_api_key}" }
  openrouter: { type: openrouter, api_key: "${secrets.openrouter_api_key}", headers: { X-Title: 247-agent } }
# USD per million tokens, merged over the built-in table (Claude, current OpenAI models, Jev); a
# model the table does not know needs input and output. OpenRouter reports cost itself, so its
# models need none.
pricing: {}                       # e.g. { claude-sonnet-5: { output: 12 }, gpt-4.1-mini: { input: 0.4, output: 1.6 } }
budgets: { daily_usd: 10 }        # global circuit breaker: over it, llm tasks fail fast until 00:00 UTC
batches: { poll: 1m }             # how often llm actions with batch: true are checked for their result
retention: { events: 90d, runs: 90d, workspaces: 7d }   # + ledger (defaults to runs), interval (1h); durations or `never` (docs/operations/monitoring.md)
