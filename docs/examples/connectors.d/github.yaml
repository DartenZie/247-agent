# GitHub connector manifest (docs/connectors/index.md): a thin REST wrapper, ops only, confined to the
# repositories listed in `repos`. The poller in github-prs.yaml turns list_pull_requests into
# events. Full reference: docs/connectors/github.md (also how to use GitHub's official MCP
# server, github-mcp-server, in its place).
#
# `ops` is the boundary: give an agent a copy of this manifest with the read ops only.
name: github
exec: ["247-agent-connector-github"]
transport: stdio
ops:
  - list_pull_requests
  - get_pull_request
  - get_pull_request_diff
  - list_issues
  - get_issue
  - list_comments
  - list_commits
  - list_workflow_runs
  - search_issues
  - add_comment
  - add_labels
config:
  token: "${secrets.github_token}"         # fine-grained PAT: the repos below, read + issues/PRs write
  repos: [acme/orchestra-site]             # owner/name; the first is the default
  # api_base: https://api.github.com       # https://<host>/api/v3 for GitHub Enterprise Server
restart: { base: 1s, max: 60s }
